[project]
name = "alldog-mjlab"
version = "0.1.0"
description = "XJTUROBOCON 四足组 机器人强化学习训练仓库"
readme = "README.md"
authors = [
    { name = "wind", email = "zeyuqin@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mjlab>=1.6.0",
]

[project.scripts]
export = "alldog_mjlab.utils.export_policy:main"
# play：项目级入口（覆盖 mjlab 的同名 console script），缺省 --checkpoint-file
# 时自动解析任务对应的最新本地 checkpoint（见 alldog_mjlab/utils/play.py）。
play = "alldog_mjlab.utils.play:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# 实验分支：MJWarp 3.14 对照。mjlab v1.6.0 原生约束 mujoco~=3.11.0 /
# mujoco-warp~=3.11.0，此处用 override-dependencies 强制解析到 3.14.0，
# 不改动 mjlab 源码、不升级 mjlab 版本。仅实验分支使用。
[tool.uv]
override-dependencies = [
    "mujoco==3.14.0",
    "mujoco-warp==3.14.0",
]

[project.entry-points."mjlab.tasks"]
alldog_mjlab = "alldog_mjlab"
