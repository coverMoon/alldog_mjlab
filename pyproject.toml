[project]
name = "alldog-mjlab"
version = "0.1.0"
description = "XJTUROBOCON 四足组 机器人强化学习训练仓库"
readme = "README.md"
authors = [
    { name = "wind", email = "zeyuqin@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mjlab>=1.6.0",
]

[project.scripts]
export = "alldog_mjlab.utils.export_policy:main"
# train：项目级入口（覆盖 mjlab 的同名 console script）。默认启用已验证的 MuJoCo
# Warp 3.14 EPA 补丁，并默认关闭 LS_ITERATIONS/HFIELD/ITERATIONS 终端刷屏打印；
# 两个环境变量 MJWARP_EPA_PATCH / MJWARP_SUPPRESS_WARNINGS 可独立关闭（见 utils/train.py）。
train = "alldog_mjlab.utils.train:main"
# play：项目级入口（覆盖 mjlab 的同名 console script），缺省 --checkpoint-file
# 时自动解析任务对应的最新本地 checkpoint（见 alldog_mjlab/utils/play.py）。
play = "alldog_mjlab.utils.play:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# MuJoCo/MJWarp 3.14.0 backend compatibility override (Wolf rough validation).
# MjLab v1.6.0 declares mujoco~=3.11.0 and mujoco-warp~=3.11.0.
# Keep MjLab at 1.6.0 (uv.lock) and override these transitive constraints;
# this combination is project-validated, not officially supported by MjLab.
# See .ai/MIGRATION.md §35 for validation scope and remaining risks.
[tool.uv]
override-dependencies = [
    "mujoco==3.14.0",
    "mujoco-warp==3.14.0",
]

[project.entry-points."mjlab.tasks"]
# 指向 tasks 子包本身（而非包根）：包 __init__ 已改为延迟导入 tasks，
# 因此 MjLab 必须显式加载该子包才会触发 register_mjlab_task。
alldog_mjlab = "alldog_mjlab.tasks"
